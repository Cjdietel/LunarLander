        document.getElementById("greyInner").addEventListener("mouseover", () => { scaleButtonUp("greyInner") })
        document.getElementById("greyInner").addEventListener("mouseleave", () => { scaleButtonDown("greyInner") })
        let mapID;
        function scaleButtonUp(button) {
            document.getElementById(button).style.transform = "scale(1.10)"
        }
        function scaleButtonDown(button) {
            document.getElementById(button).style.transform = "scale(1.00)"
        }


        function getUsername() {
            let username = document.getElementById("username").value
            let password = document.getElementById("password").value

            let userInfo = {
                name: username,
                password: password
            }
            sock.emit("name", userInfo)

        }
        sock.on("exists", function (data) {
            document.getElementById("accountExists").style.visibility = "visible"
        })
        sock.on("doesnt", function (data) {
            loginConfirmed(document.getElementById("username").value)
        })
        function loginConfirmed(username) {
            document.getElementById("loginBody").style.display = "none";
            document.getElementById("titleScreen").style.display = "flex";
            landerDom.style.display = "inline";

            document.getElementById("welcome1").innerText = "Welcome, " + username + "!"
        }

        function setOuterBorder(color) {
            myLander.outerColor = color
            document.getElementById("landerSvg").style.stroke = color
            for (let i = 0; i < debrisArray.length; i++) {
                debrisArray[i].dom.style.stroke = color
            }
        }
        function setInnerColor(color) {
            myLander.innerColor = color
            document.getElementById("landerSvg").style.fill = color
            for (let i = 0; i < debrisArray.length; i++) {
                debrisArray[i].dom.style.fill = color
            }
        }
        function loadEarth() {
            mapID = 3
            earth = true
            maxWindV = 30
            document.getElementById("ground").style.backgroundImage = `url("grass.jpg")`
            runGame()
        }
        function loadMars() {
            mapID = 2
            mars = true
            maxWindV = 12
            document.getElementById("ground").style.backgroundImage = `url("mars-water.jpg")`
            runGame()
        }

        function loadMoon() {
            mapID = 1
            moon = true
            maxWindV = 0
            document.getElementById("ground").style.backgroundImage = `url("moon.jpg")`
            runGame()
        }
        function gameEnd() {
            //move lander DOM to titlescreen from gameDiv
            landerDom.style.transform = `rotate(0deg)`
            landerDom.parentNode.removeChild(landerDom)
            document.getElementById("titleScreenLander").appendChild(landerDom)
            landerDom.style.top = "0px"
            landerDom.style.left = "0px"

            moon = false
            earth = false
            mars = false

            sock.emit("leftSpace")
            gameRunning = false
            playerStatusChange()

            clearInterval(gameLoopTimerID)
            document.getElementById("backgroundMusic").pause()
            document.getElementById("titleScreen").style.display = "flex"
            document.getElementById("gameDiv").style.display = "none"
            landerDom.style.display = "flex"

            // wait until other players finish
            // display times
            let firstPlace = username.value
            let secondPlace = ""
            //alert("First Place: " + firstPlace + " " + timer + " seconds" + " \n" + "Second Place: " + secondPlace)
        }
        function Explosion() {
            document.getElementById("debrisDiv").display = "inline"
            myLander.crash = true
            let velocity = Math.sqrt(Math.pow(yVelocity, 2) + Math.pow(xVelocity, 2))
            velocity /= 1.3
            velocity += 10 // add minimum crash size
            for (i = 0; i < debrisArray.length; i++) {
                let angle = Math.random() * Math.PI
                let random = Math.random()
                debrisArray[i].yVelocity = velocity * Math.sin(angle) * random
                debrisArray[i].xVelocity = velocity * Math.cos(angle) * random
                debrisArray[i].y = myLander.y
                debrisArray[i].x = myLander.x
                debrisArray[i].spinRate = (Math.random() - 0.5) * 30
                debrisArray[i].angle = (Math.random() * 360)
                debrisArray[i].scale = Math.random() / 5 + 0.1

                let dom = debrisArray[i].dom
                dom.style.left = `${myLander.x}px`
                dom.style.top = `${-myLander.y}px`
            }
            setTimeout(gameEnd, 3000)
            landerDom.style.display = "none"
            document.getElementById("innerFlame").style.visibility = "hidden"
            document.getElementById("outterFlame").style.visibility = "hidden"
            document.getElementById("debrisDiv").style.display = "inline"
            document.getElementById("Explosion").load()
            document.getElementById("Explosion").play()
            document.getElementById("thrusterSound").pause()
            document.getElementById("backgroundMusic").pause()

        }
        
        function playerStatusChange() {
            if (gameRunning) {
                if (landerDom.parentNode != gameDom) {
                    if (landerDom.parentNode != null) {
                        landerDom.parentNode.removeChild(landerDom)
                    }
                    gameDom.appendChild(landerDom)
                    landerDom.style.display = "flex"
                }
                if (player2joined) {
                    if (landerDom2.parentNode != gameDom) {
                        if (landerDom2.parentNode != null) {
                            landerDom2.parentNode.removeChild(landerDom2)
                        }
                        gameDom.appendChild(landerDom2)
                        landerDom2.style.display = "flex"
                    }
                }
                else {
                    if (landerDom2.parentNode == gameDom) {
                        gameDom.removeChild(landerDom2)
                        landerDom2.style.display = "none"
                    }

                }
                // check if player2 joined
                // check if player2 left
            }
            else {
                if (landerDom.parentNode == gameDom) {
                    gameDom.removeChild(landerDom)
                    titleScreenDom.appendChild(landerDom)
                    landerDom.style.top = "0px"
                    landerDom.style.left = "0px"
                    landerDom.style.transform = `rotate(0deg)`
                }
                if (landerDom2.parentNode == gameDom) {
                    gameDom.removeChild(landerDom2)
                    landerDom2.style.top = "0px"
                    landerDom2.style.left = "0px"
                    landerDom2.style.transform = `rotate(0deg)`
                }
            }
        }
        function runGame() {
            document.getElementById("debrisDiv").style.display = "none"
            document.getElementById("backgroundMusic").volume = "0.7"
            thrust = 45000
            windCount = 0
            yVelocity = 0
            xVelocity = 0
            windVelocity = 0

            sock.emit("enteredSpace")
            gameRunning = true
            playerStatusChange()

            myLander.resetPhysics()

            timer = 0

            //move lander DOM from titlescreen to gameDiv

            landerDom.parentNode.removeChild(landerDom)
            document.getElementById("gameDiv").appendChild(landerDom)

            gameRunning = true
            xVelocity = 0
            yVelocity = 0
            document.getElementById("titleScreen").style.display = "none"
            document.getElementById("gameDiv").style.display = "flex"
            document.getElementById("backgroundMusic").load()
            document.getElementById("backgroundMusic").play()

            // calling 3rd party API https://bernii.github.io/gauge.js/
            var opts =
            {
                angle: 0.15, // The span of the gauge arc
                lineWidth: 0.44, // The line thickness
                radiusScale: 1, // Relative radius
                pointer:
                {
                    length: 0.6, // // Relative to gauge radius
                    strokeWidth: 0.08, // The thickness
                    color: '#000000' // Fill color
                },
                limitMax: false,     // If false, max value increases automatically if value > maxValue
                limitMin: false,     // If true, the min value of the gauge will be fixed
                colorStart: '#6FADCF',   // Colors
                colorStop: 'Red',    // just experiment with them
                strokeColor: '#E0E0E0',  // to see which ones work best for you
                generateGradient: true,
                highDpiSupport: true,     // High resolution support
                staticLabels:
                {
                    font: "10px sans-serif",  // Specifies font
                    labels: [0, 25, 50, 75, 100],  // Print labels at these values
                    color: "white",  // Optional: Label text color
                    fractionDigits: 0  // Optional: Numerical precision. 0=round off.
                },
            };

            var opts2 =
            {
                angle: 0.15, // The span of the gauge arc
                lineWidth: 0.44, // The line thickness
                radiusScale: 1, // Relative radius
                pointer:
                {
                    length: 0.6, // // Relative to gauge radius
                    strokeWidth: 0.08, // The thickness
                    color: '#000000' // Fill color
                },
                limitMax: false,     // If false, max value increases automatically if value > maxValue
                limitMin: false,     // If true, the min value of the gauge will be fixed
                colorStart: '#6FADCF',   // Colors
                colorStop: 'Red',    // just experiment with them
                strokeColor: '#E0E0E0',  // to see which ones work best for you
                generateGradient: true,
                highDpiSupport: true,     // High resolution support
                staticLabels:
                {
                    font: "10px sans-serif",  // Specifies font
                    labels: [0, 250, 500, 750, 1000],  // Print labels at these values
                    color: "white",  // Optional: Label text color
                    fractionDigits: 0  // Optional: Numerical precision. 0=round off.
                },
            }
            var target = document.getElementById("gauge"); // your canvas element
            var gauge = new Gauge(target).setOptions(opts); // create sexy gauge!
            gauge.maxValue = 100; // set max gauge value
            gauge.setMinValue(0);  // Prefer setter over gauge.minValue = 0
            gauge.animationSpeed = 32; // set animation speed (32 is default value)

            // opts.staticLabels.labels = [-25, -10, 0, 10, 25]
            opts.colorStop = "#E0E0E0"
            var target2 = document.getElementById("gauge2"); // your canvas element
            var gauge2 = new Gauge(target2).setOptions(opts); // create sexy gauge!
            gauge2.maxValue = 25; // set max gauge value
            gauge2.setMinValue(-25);  // Prefer setter over gauge.minValue = 0
            gauge2.animationSpeed = 32; // set animation speed (32 is default value)

            opts.colorStop = "#E0E0E0"
            var target3 = document.getElementById("gauge3"); // your canvas element
            var gauge3 = new Gauge(target3).setOptions(opts2); // create sexy gauge!
            gauge3.maxValue = 1000; // set max gauge value
            gauge3.setMinValue(0);  // Prefer setter over gauge.minValue = 0
            gauge3.animationSpeed = 32; // set animation speed (32 is default value)


            if (earth) {
                gravity = -9.8
                thrust = thrust * (9.8 / 1.62)

            }
            else if (mars) {
                gravity = -3.71
                thrust = thrust * (9.8 / 3.71)
            }
            else if (moon) {
                gravity = -1.62
            }

            let counter = 0
            gameLoopTimerID = setInterval(() => {
                if (gameRunning) {

                    let landingPadDom = document.getElementById("landingDiv")
                    let flyingSpaceDom = document.getElementById("flyingSpace")
                    windCount++
                    if (windCount > 3000 / mspf) {
                        windCount = 0
                        windChange(-maxWindV, maxWindV)
                    }

                    if (myLander.crash == false) {
                        timer++

                        // always have gravity and wind
                        let yForce = mass * gravity
                        let xForce = windVelocity * dragCoefficient

                        // add thrust force
                        if (myLander.thrustOn) {
                            yForce += thrust * Math.cos(myLander.angle * Math.PI / 180)
                            xForce += thrust * Math.sin(myLander.angle * Math.PI / 180)
                            myLander.gas -= 1
                            if (myLander.gas <= 0) {
                                myLander.thrustOn = false
                                myLander.flameStrength = 0
                                myLander.gas = 0
                                turnRight = false
                                turnLeft = false
                            }
                        }

                        // dv=(Fnet/m)*dt
                        yVelocity += (yForce / mass) * (mspf / 1000)
                        xVelocity += (xForce / mass) * (mspf / 1000)

                        // ds=v*dt
                        myLander.y += yVelocity * (mspf / 1000) * 15
                        myLander.x += xVelocity * (mspf / 1000) * 15
                        if (myLander.thrustOn || turnLeft || turnRight) {
                            myLander.flameStrength += 1
                            if (myLander.flameStrength > 30) {
                                myLander.flameStrength = 30
                            }
                        }
                        else {
                            myLander.flameStrength -= 1
                            if (myLander.flameStrength < 0) {
                                myLander.flameStrength = 0
                            }
                        }
                        landerDom.style.transform = `rotate(${myLander.angle}deg)`
                        landerDom.style.left = `${myLander.x}px`
                        landerDom.style.top = `${-myLander.y}px`
                        if (myLander.flameStrength > 0) {
                            document.getElementById("innerFlame").style.visibility = "visible"
                            document.getElementById("outterFlame").style.visibility = "visible"
                            document.getElementById("outterFlame").setAttribute("points", `42,76 58,76 50,${76 + 23 * (myLander.flameStrength / 30)}`)
                            document.getElementById("innerFlame").setAttribute("points", `46,76 54,76 50,${76 + 11 * (myLander.flameStrength / 30)}`)
                        }
                        else {
                            document.getElementById("innerFlame").style.visibility = "hidden"
                            document.getElementById("outterFlame").style.visibility = "hidden"
                        }

                        if (turnLeft == true) {
                            myLander.angle -= angleDelta
                        }
                        if (turnRight == true) {
                            myLander.angle += angleDelta
                        }
                        if (myLander.flameStrength > 0) {
                            document.getElementById("thrusterSound").play()
                            document.getElementById("thrusterSound").volume = myLander.flameStrength / 30
                        }
                        if (myLander.flameStrength == 0) {
                            document.getElementById("thrusterSound").pause()
                        }
                        if (landerDom.offsetTop + landerDom.offsetHeight >= landingPadDom.offsetTop) {
                            if ((Math.abs(yVelocity) > 5 || Math.abs(xVelocity) > 5) || myLander.angle > 10) {
                                Explosion()
                            }
                            else if (landerDom.offsetLeft >= landingPadDom.offsetLeft &&
                                landerDom.offsetLeft + landerDom.offsetWidth <= landingPadDom.offsetLeft + landingPadDom.offsetWidth) {
                                landerDom.style.transform = `rotate(0deg)`
                                document.getElementById("innerFlame").style.visibility = "hidden"
                                document.getElementById("outterFlame").style.visibility = "hidden"
                                document.getElementById("thrusterSound").pause()
                                let gameInfo = {
                                    name: username.value,
                                    time: Math.round((1 / (timer)) * 100000),
                                    map: mapID
                                };
                                alert("You landed safely with a score of " + gameInfo.time + "!")
                                stringInfo = JSON.stringify(gameInfo)
                                sock.emit("gamewon", stringInfo)
                                gameEnd()
                            }
                            else if ((landerDom.offsetLeft < landingPadDom.offsetLeft &&
                                landerDom.offsetLeft + landerDom.offsetWidth < landingPadDom.offsetLeft + landingPadDom.offsetWidth) ||
                                (landerDom.offsetLeft < landingPadDom.offsetLeft + landingPadDom.offsetWidth &&
                                    landerDom.offsetLeft + landerDom.offsetWidth > landingPadDom.offsetLeft + landingPadDom.offsetWidth)) {
                                Explosion()
                            }
                        }
                        else {
                            if (landerDom.offsetLeft > flyingSpaceDom.offsetWidth - landerDom.offsetWidth) {
                                myLander.x = flyingSpaceDom.offsetWidth - landerDom.offsetWidth
                                xVelocity = 0
                            }
                            else if (myLander.x < 0) {
                                myLander.x = 0
                                xVelocity = 0
                            }
                            if (myLander.y > 0) {
                                myLander.y = 0
                                yVelocity = 0
                            }
                        }
                        let velocity = Math.abs(xVelocity) + Math.abs(yVelocity)
                        gauge.set((myLander.flameStrength / 30) * 100); // set actual value
                        gauge2.set(yVelocity)
                        gauge3.set(myLander.gas)
                    }
                    else {
                        for (let i = 0; i < debrisArray.length; i++) {
                            debrisArray[i].x += (debrisArray[i].xVelocity * mspf / 1000) * 15
                            debrisArray[i].dom.style.left = `${debrisArray[i].x}px`
                            debrisArray[i].yVelocity += gravity * (mspf / 1000)
                            debrisArray[i].y += (debrisArray[i].yVelocity * mspf / 1000) * 15
                            debrisArray[i].dom.style.top = `${-debrisArray[i].y}px`
                            debrisArray[i].angle += debrisArray[i].spinRate
                            debrisArray[i].dom.style.transform = `scale(${debrisArray[i].scale}) rotate(${debrisArray[i].angle}deg)`
                        }
                    }
                }
                let data = JSON.stringify(myLander)
                sock.emit('data', data)
            }, mspf);
            sock.on("entered", function (data) {
                player2joined = true;
                playerStatusChange();
            })
            sock.on("left", function (data) {
                player2joined = false;
                playerStatusChange();
            })
            sock.on('playerData', function (playerData) {
                parsedPlayerData = JSON.parse(playerData)
                landerDom2.style.transform = `rotate(${parsedPlayerData.angle}deg)`
                landerDom2.style.left = `${parsedPlayerData.x}px`
                landerDom2.style.top = `${-parsedPlayerData.y}px`
                document.getElementById("landerSvg2").style.fill = parsedPlayerData.innerColor
                document.getElementById("landerSvg2").style.stroke = parsedPlayerData.outerColor

                if (parsedPlayerData.flameStrength > 0) {
                    document.getElementById("innerFlame2").style.visibility = "visible"
                    document.getElementById("outterFlame2").style.visibility = "visible"
                    document.getElementById("outterFlame2").setAttribute("points", `42,76 58,76 50,${76 + 23 * (parsedPlayerData.flameStrength / 30)}`)
                    document.getElementById("innerFlame2").setAttribute("points", `46,76 54,76 50,${76 + 11 * (parsedPlayerData.flameStrength / 30)}`)
                }
                else {
                    document.getElementById("innerFlame2").style.visibility = "hidden"
                    document.getElementById("outterFlame2").style.visibility = "hidden"
                }


            })

            function windChange(min, max) {
                if (windVelocity > 0) {
                    max = max - windVelocity
                }
                else if (windVelocity < 0) {
                    min = min - windVelocity
                }
                return windVelocity = windVelocity + (Math.floor(Math.random() * (max - min + 1)) + min);
            }

            document.getElementById("body").addEventListener("keydown", keydown)
            document.getElementById("body").addEventListener("keyup", keyup)
            function keydown(e) {
                if (e.keyCode == 38) {
                    if (myLander.gas > 0) {
                        myLander.thrustOn = true
                    }
                }
                else if (e.keyCode == 37) {
                    if (myLander.gas > 0) {
                        turnLeft = true
                    }
                }
                else if (e.keyCode == 39) {
                    if (myLander.gas > 0) {
                        turnRight = true
                    }
                }
            }
            function keyup(e) {
                if (e.keyCode == 38) {
                    myLander.thrustOn = false;
                }
                else if (e.keyCode == 37) {
                    turnLeft = false
                }
                else if (e.keyCode == 39) {
                    turnRight = false
                }

            }
        }

    </script>
